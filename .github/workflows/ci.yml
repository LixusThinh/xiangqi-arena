name: CI

on:
  push:
    branches: [develop, main, 'feat/**']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  pull-requests: write
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.0'
  DATABASE_URL: 'postgresql://mock:mock@localhost:5432/mock?schema=public'
  CI: 'true'

jobs:
  # ──────────────────────────────────────────
  # JOB 1: Lint (core, web, server)
  # ──────────────────────────────────────────
  lint:
    name: 🔍 Lint (core, web, server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client (mock DATABASE_URL)
        run: pnpm --filter @xiangqi-arena/server prisma:generate

      - name: Lint xiangqi-core
        run: pnpm --filter @xiangqi-arena/xiangqi-core lint

      - name: Lint web
        run: pnpm --filter @xiangqi-arena/web lint

      - name: Lint server
        run: pnpm --filter @xiangqi-arena/server lint

  # ──────────────────────────────────────────
  # JOB 2: Test & QA Rules Harness
  # ──────────────────────────────────────────
  test:
    name: 🧪 Test Suite & QA Rules Harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client (mock DATABASE_URL)
        run: pnpm --filter @xiangqi-arena/server prisma:generate

      - name: Verify fixture matches generator
        run: |
          pnpm --filter @xiangqi-arena/xiangqi-core fixtures:generate
          git diff --exit-code packages/xiangqi-core/tests/fixtures/

      - name: Run xiangqi-core test suite (Jest + JUnit XML)
        run: pnpm --filter @xiangqi-arena/xiangqi-core test
        env:
          CI: true

      - name: Run web test suite
        run: pnpm --filter @xiangqi-arena/web test
        env:
          CI: true

      - name: Run server test suite
        run: pnpm --filter @xiangqi-arena/server test
        env:
          CI: true

      - name: "[XQA-47/48] QA Rules Fixture Harness (pass/fail per TC)"
        run: pnpm --filter @xiangqi-arena/xiangqi-core test:harness

      - name: Upload JUnit XML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-report
          path: packages/xiangqi-core/reports/junit.xml
          retention-days: 30

      - name: Publish test results to GitHub Checks
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: 'packages/xiangqi-core/reports/junit.xml'
          check_name: 'Test Results – xiangqi-core'
          fail_on_failure: false
          require_tests: true
          detailed_summary: true
          include_passed: true

      - name: Upload QA Report Markdown
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-XQA-47-48-release-1.0
          path: packages/xiangqi-core/reports/rules-harness-report.md
          retention-days: 90

  # ──────────────────────────────────────────
  # JOB 3: Build (core, web, server)
  # ──────────────────────────────────────────
  build:
    name: 🏗️ Build (core, web, server)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client (mock DATABASE_URL)
        run: pnpm --filter @xiangqi-arena/server prisma:generate

      - name: Build xiangqi-core
        run: pnpm --filter @xiangqi-arena/xiangqi-core build

      - name: Build web
        run: pnpm --filter @xiangqi-arena/web build

      - name: Build server
        run: pnpm --filter @xiangqi-arena/server build

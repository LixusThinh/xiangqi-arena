services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./apps/server/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xiangqi_arena}
      POSTGRES_USER: ${POSTGRES_USER:-xiangqi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xiangqi_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

volumes:
  postgres-data:
